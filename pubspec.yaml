name: my_money
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  intl: ^0.20.2
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  file_picker: ^9.0.2
  logger: ^2.5.0
  shared_preferences: ^2.5.2
  googleapis: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
